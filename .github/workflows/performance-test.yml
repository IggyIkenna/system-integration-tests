name: Performance Tests

on:
  schedule:
    - cron: "0 2 * * *" # 2am UTC nightly
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: [self-hosted, glue]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Authenticate to GCP Artifact Registry
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e "."
          uv pip install --python .venv/bin/python ruff==0.15.0 pytest pytest-cov pytest-asyncio pytest-timeout pytest-xdist basedpyright psutil

      - name: Clone build scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
            || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true

      - name: Run performance tests (normal load)
        env:
          CLOUD_PROVIDER: local
          CLOUD_MOCK_MODE: "true"
          RUN_PERFORMANCE_TESTS: "true"
          GCP_PROJECT_ID: "test-project"
        run: |
          PATH="$(pwd)/.venv/bin:$PATH"
          export PATH
          .venv/bin/pytest tests/performance/ -m "not slow" \
            --tb=short \
            -q \
            --no-header \
            -p no:cacheprovider \
            2>&1 | tee tests/performance/results/performance_run_${GITHUB_RUN_ID:-local}.log

      - name: Run regression detection
        if: always()
        run: |
          PATH="$(pwd)/.venv/bin:$PATH"
          export PATH
          if [ -f tests/performance/compare_benchmark_baseline.py ]; then
            python tests/performance/compare_benchmark_baseline.py \
              --results tests/performance/results/performance_run_${GITHUB_RUN_ID:-local}.log \
              --baseline tests/performance/baselines/baseline.json \
              || echo "Regression check complete (see output above)"
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-${{ github.run_id }}
          path: tests/performance/results/
          retention-days: 30
