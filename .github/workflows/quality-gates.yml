name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    if: github.event_name \!= 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
        ports:
          - 8085:8085
        options: >-
          --entrypoint gcloud
        # args is not supported in services; emulator started via entrypoint override in docker run
        # Use: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085

      gcs-emulator:
        image: fsouza/fake-gcs-server:latest
        ports:
          - 4443:4443
        options: >-
          --health-cmd "curl -sf http://localhost:4443/storage/v1/b || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Authenticate to GCP Artifact Registry
        if: ${{ secrets.GCP_SA_KEY \!= '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure pip for Artifact Registry
        if: ${{ secrets.GCP_SA_KEY \!= '' }}
        run: |
          pip install uv keyring keyrings.google-artifactregistry-auth
          if [ -f pip.conf ]; then
            mkdir -p ~/.pip
            cp pip.conf ~/.pip/pip.conf
          fi

      - name: Install UV
        run: pip install uv

      - name: Install ripgrep (required for codex checks)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]" || uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python ruff==0.15.0 pytest pytest-cov pytest-asyncio pytest-timeout pytest-xdist basedpyright bandit pip-audit
      - name: Clone build scripts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
            || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true
          echo "✅ unified-trading-pm cloned for quality-gates base scripts"

      - name: Run quality gates
        env:
          CLOUD_MOCK_MODE: "true"
          CLOUD_PROVIDER: local
          GCP_PROJECT_ID: "test-project"
          PUBSUB_EMULATOR_HOST: localhost:8085
          STORAGE_EMULATOR_HOST: http://localhost:4443
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          bash scripts/quality-gates.sh --no-fix
