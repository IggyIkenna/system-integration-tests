name: Smoke Test Gate

# Triggered by PM's debounced `staging-changed` repository_dispatch (NOT raw push:staging).
# On success dispatches staging-validated to unified-trading-pm so PM can promote repos
# staging→main in tier order.
#
# Part of the staging-to-main automation:
#   service repo → staging → PM sit-debounce-trigger.yml (60s quiet-period debounce, batches
#   rapid staging merges into ONE run) → repository_dispatch `staging-changed` → (this workflow)
#   → code-tests dispatches `sit-lock` → PM sit-gate.yml locks staging →
#   → on pass dispatch fires `staging-validated` → PM staging-to-main.yml → main
#
# TRIGGER MODEL (revived 2026-06-01, cicd P1 #257):
#   PM's sit-debounce-trigger.yml is the SINGLE debouncer. This gate is dispatch-driven only.
#   The old `push:[staging]` trigger + in-job `sleep 600` quiet-period was removed: it
#   double-debounced against PM and, combined with `concurrency: cancel-in-progress: true`,
#   the 600s sleep was cancelled mid-wait by any second trigger in the group → the gate NEVER
#   reached its dispatch steps → PM sit-gate got zero runs → staging-to-main never fired.
#   PM's `staging-changed` dispatch was previously ORPHANED (no listener); it is now wired here.
#   `cancel-in-progress: false` so a queued dispatch never cancels a run that already locked staging.
#
# repository_dispatch ALWAYS runs the workflow definition from the DEFAULT branch (main) and
# resolves github.sha/github.ref to main — so SIT-repo checkouts pin `ref: staging` explicitly
# to test the staging code, and the staging-validated payload resolves the real staging SHA.
#
# SIT VERSION SCOPE: Only repos with staging_versions[repo] >= 0.1.0 are tested.
# If no such repos exist on staging, the workflow exits immediately (no lock dispatched).
#
# SIT MODE:
#   full (default) — code-tests + deployment-tests; full contract + integration suite
#   abbreviated    — tests/abbreviated/ only (<2 min schema checks); used for hotfix path
#                    and repos with sit_level=abbreviated in PM manifest (e.g. PM, Codex)
#   Requested via client_payload.sit_mode (dispatch) or workflow_dispatch input; defaults full.
#
# Hotfix detection: PM manifest staging_status.hotfix_mode=true (set by quickmerge --hotfix)
# sit_level detection: PM manifest repositories[repo].sit_level (abbreviated|standard)
#
# Jobs:
#   setup               — reads staging_versions, hotfix_mode, sit_level; sets skip/mode guard
#   abbreviated-tests   — runs tests/abbreviated/ -m abbreviated_sit (<2 min); hotfix/abbreviated path
#   code-tests          — Layer 3a: static tests, no live services required (<10 min); full path only
#   deployment-tests    — Layer 3b/3c: tests requiring docker-compose mock stack; full path only
#   dispatch            — fires staging-validated to PM; clears hotfix_mode if set

on:
  repository_dispatch:
    types: [staging-changed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"
      sit_mode:
        description: "SIT mode: full or abbreviated"
        required: false
        default: "full"

concurrency:
  group: sit-staging
  # false: never cancel an in-flight run — a cancelled run that already dispatched sit-lock
  # would leave staging locked forever. PM's sit-debounce-trigger already batches upstream and
  # skips dispatch while staging_status.locked, so queueing (not cancelling) is safe.
  cancel-in-progress: false

jobs:
  setup:
    name: SIT Setup (v0.1+ repo filter + mode detection + dep-slice)
    runs-on: [self-hosted, glue]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_v1_repos: ${{ steps.filter.outputs.has_v1_repos }}
      v1_repos_json: ${{ steps.filter.outputs.v1_repos_json }}
      sit_mode: ${{ steps.filter.outputs.sit_mode }}
      # SIT-slicing outputs (§299): slice_mode ∈ {targeted, BROAD, EXEMPT}
      # slice_repos_json = JSON array of repos in the slice (empty for BROAD/EXEMPT → full run)
      # pytest_filter = pytest -k expression (empty for BROAD → no filter; empty for EXEMPT → skip)
      slice_mode: ${{ steps.slice.outputs.slice_mode }}
      slice_repos_json: ${{ steps.slice.outputs.slice_repos_json }}
      pytest_filter: ${{ steps.slice.outputs.pytest_filter }}

    steps:
      # No in-job debounce: PM's sit-debounce-trigger.yml is the single debouncer (60s quiet
      # period + rapid-merge batching). The old `sleep 600` here double-debounced and self-
      # cancelled via the concurrency group — see TRIGGER MODEL header (cicd P1 #257).
      - name: Clone PM manifest and filter v1 repos + detect SIT mode
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_SIT_MODE: ${{ github.event.client_payload.sit_mode || inputs.sit_mode || 'full' }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            /tmp/pm-repo

          python3 - <<'PYEOF'
          import json
          import sys
          import os
          from pathlib import Path

          try:
              from packaging.version import Version
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "packaging", "-q"])
              from packaging.version import Version

          manifest = json.loads(Path("/tmp/pm-repo/workspace-manifest.json").read_text())
          staging_versions = manifest.get("staging_versions", {})
          staging_status = manifest.get("staging_status", {})
          repositories = manifest.get("repositories", {})

          # Detect SIT mode: hotfix_mode in staging_status OR workflow_dispatch input OR
          # all promoted repos have sit_level=abbreviated
          hotfix_mode = staging_status.get("hotfix_mode", False)
          dispatch_mode = os.environ.get("DISPATCH_SIT_MODE", "full")

          # Check if all repos on staging have sit_level=abbreviated
          staging_repos = [r for r in staging_versions if not r.startswith("_")]
          all_abbreviated = all(
              repositories.get(r, {}).get("sit_level", "standard") == "abbreviated"
              for r in staging_repos
          ) if staging_repos else False

          sit_mode = "full"
          if hotfix_mode or dispatch_mode == "abbreviated" or all_abbreviated:
              sit_mode = "abbreviated"
              reason = "hotfix_mode" if hotfix_mode else ("all_abbreviated" if all_abbreviated else "dispatch_input")
              print(f"SIT mode: abbreviated (reason: {reason})")
          else:
              print("SIT mode: full")

          v1_repos = [
              repo for repo, ver in staging_versions.items()
              if not repo.startswith("_") and Version(ver) >= Version("0.1.0")
          ]

          # Both modes filter to v0.1+ repos — all repos at 0.1.0+ qualify for SIT.
          active_repos = v1_repos

          if not active_repos:
              print(f"No repos with staging_versions >= 0.1.0 found on staging (mode={sit_mode}). Skipping SIT.")
              with open("/tmp/filter_outputs.txt", "w") as f:
                  f.write("has_v1_repos=false\n")
                  f.write("v1_repos_json=[]\n")
                  f.write(f"sit_mode={sit_mode}\n")
              sys.exit(0)

          print(f"Active repos for SIT ({sit_mode}): {active_repos}")
          with open("/tmp/filter_outputs.txt", "w") as f:
              f.write("has_v1_repos=true\n")
              f.write(f"v1_repos_json={json.dumps(active_repos)}\n")
              f.write(f"sit_mode={sit_mode}\n")
          PYEOF

          # Write outputs to GITHUB_OUTPUT
          if [ -f /tmp/filter_outputs.txt ]; then
            cat /tmp/filter_outputs.txt >> "$GITHUB_OUTPUT"
          else
            echo "has_v1_repos=false" >> "$GITHUB_OUTPUT"
            echo "v1_repos_json=[]" >> "$GITHUB_OUTPUT"
            echo "sit_mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute SIT dep-slice (§299 — targeted vs BROAD vs EXEMPT)
        id: slice
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          # Changed repos: prefer explicit client_payload.pending_repos (set by PM debouncer),
          # then workflow_dispatch manual override. Falls back to [] → BROAD (safety fallback).
          CHANGED_REPOS_JSON: ${{ github.event.client_payload.pending_repos || '[]' }}
        run: |
          set -euo pipefail

          # Checkout the SIT repo (staging branch) to get compute_sit_slice.py
          OWNER="${{ github.repository_owner }}"
          git clone --depth=1 -b staging \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/system-integration-tests.git" \
            /tmp/sit-repo 2>/dev/null \
            || git clone --depth=1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/system-integration-tests.git" \
              /tmp/sit-repo

          # Convert JSON array to space-separated args for compute_sit_slice.py
          CHANGED_ARGS=""
          if [ -n "$CHANGED_REPOS_JSON" ] && [ "$CHANGED_REPOS_JSON" != "null" ] && [ "$CHANGED_REPOS_JSON" != "[]" ]; then
            CHANGED_ARGS=$(echo "$CHANGED_REPOS_JSON" | python3 -c "
          import json, sys
          repos = json.load(sys.stdin)
          if isinstance(repos, list):
              print(' '.join(str(r) for r in repos))
          " 2>/dev/null || true)
          fi

          # Run slice computation; on any error emit BROAD (safety fallback — never under-test)
          SLICE_OUTPUT=""
          if [ -f /tmp/sit-repo/scripts/compute_sit_slice.py ]; then
            SLICE_OUTPUT=$(python3 /tmp/sit-repo/scripts/compute_sit_slice.py \
              --manifest /tmp/pm-repo/workspace-manifest.json \
              --topology /tmp/pm-repo/configs/runtime-topology.yaml \
              ${CHANGED_ARGS:+--changed $CHANGED_ARGS} \
              2>/dev/null) || true
          fi

          # Parse output or use BROAD fallback
          if [ -z "$SLICE_OUTPUT" ]; then
            echo "WARN: compute_sit_slice.py produced no output — falling back to BROAD" >&2
            SLICE_OUTPUT="SLICE_MODE=BROAD
          SLICE_REPOS_JSON=[]
          PYTEST_FILTER="
          fi

          # Write to GITHUB_OUTPUT
          echo "$SLICE_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "Slice outputs:" >&2
          echo "$SLICE_OUTPUT" >&2

  abbreviated-tests:
    name: Abbreviated SIT (contract + workflow sanity, <2 min)
    runs-on: [self-hosted, glue]
    needs: setup
    # Also check slice_mode != EXEMPT: a PM-only change should not gate on SIT at all.
    if: |
      needs.setup.outputs.has_v1_repos == 'true' &&
      needs.setup.outputs.sit_mode == 'abbreviated' &&
      needs.setup.outputs.slice_mode != 'EXEMPT'
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Pin staging: repository_dispatch/workflow_dispatch default to the repo default branch
          # (main); we always test the staging code that PM is gating for promotion.
          ref: staging

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      # SIT's pyproject [tool.uv.sources] are filesystem path=../<repo> editable deps — the sibling
      # repos must exist on disk before `uv pip install -e .`. Mirror full-workspace-sit.yml.
      - name: Assemble sibling workspace (editable path deps)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          cd ..
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            unified-trading-pm
          mapfile -t REPOS < <(python3 - <<'PY'
          import json
          m = json.load(open("unified-trading-pm/workspace-manifest.json"))
          seen = []
          for lvl in m.get("topologicalOrder", {}).get("levels", []):
              for r in lvl.get("repos", []):
                  if r not in ("unified-trading-pm", "system-integration-tests") and r not in seen:
                      seen.append(r)
          print("\n".join(seen))
          PY
          )
          echo "Cloning ${#REPOS[@]} sibling repos @ staging (fallback main)..."
          for r in "${REPOS[@]}"; do
            git clone --depth=1 -b staging \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || git clone --depth=1 -b main \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || echo "WARN: could not clone $r (uv will fail loudly if it is a required sibling)"
          done
          echo "Assembled workspace:" && ls -d ./*/

      - name: Install dependencies
        run: |
          uv pip install -e . --system --quiet

      - name: Run abbreviated SIT (contract normalization + workflow sanity)
        run: |
          pytest tests/abbreviated/ \
            -m "abbreviated_sit" -v --tb=short --no-header \
            --timeout=120 \
            -q --json-report --json-report-file=abbreviated_sit_report.json \
            2>&1 | tee abbreviated_sit_output.txt

      - name: Upload abbreviated SIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abbreviated-sit-report
          path: |
            abbreviated_sit_report.json
            abbreviated_sit_output.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (abbreviated-tests failure)."

  code-tests:
    name: Code Tests (static, <10 min)
    runs-on: [self-hosted, glue]
    needs: setup
    # slice_mode EXEMPT = PM-only change; SIT must not run. Otherwise full-mode gate proceeds.
    if: |
      needs.setup.outputs.has_v1_repos == 'true' &&
      needs.setup.outputs.sit_mode == 'full' &&
      needs.setup.outputs.slice_mode != 'EXEMPT'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Lock staging (dispatch sit-lock to PM)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          # Read staging_commits from PM manifest (cloned in setup job)
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            /tmp/pm-repo-lock

          COMMIT_SHAS=$(python3 -c "
          import json
          with open('/tmp/pm-repo-lock/workspace-manifest.json') as f:
              m = json.load(f)
          commits = {k: v for k, v in m.get('staging_commits', {}).items() if not k.startswith('_')}
          print(json.dumps(commits))
          ")

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"sit-lock\", \"client_payload\": {\"commit_shas\": ${COMMIT_SHAS}}}"
          echo "SIT lock dispatched to PM."

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Pin staging: repository_dispatch/workflow_dispatch default to the repo default branch
          # (main); we always test the staging code that PM is gating for promotion.
          ref: staging

      # unified-trading-codex is ARCHIVED (folded into unified-trading-pm at codex/) — it is no
      # longer a clonable repo. The codex/ directory now lives inside PM. The SIT readiness check
      # reads it from the PM clone the deps-assembly step lays down at ../unified-trading-pm/codex.
      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      # SIT's pyproject.toml declares [tool.uv.sources] path=../<repo> editable deps for the whole
      # workspace (UTL/UAC/all services). `uv pip install -e .` resolves those FILESYSTEM paths, so
      # every sibling repo MUST exist on disk first. Mirror full-workspace-sit.yml: clone the active
      # workspace from the PM manifest topologicalOrder as siblings (staging, fallback main).
      - name: Assemble sibling workspace (editable path deps)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          # Siblings live one level up from this checkout (../<repo> per pyproject path sources).
          cd ..
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            unified-trading-pm
          mapfile -t REPOS < <(python3 - <<'PY'
          import json
          m = json.load(open("unified-trading-pm/workspace-manifest.json"))
          seen = []
          for lvl in m.get("topologicalOrder", {}).get("levels", []):
              for r in lvl.get("repos", []):
                  if r not in ("unified-trading-pm", "system-integration-tests") and r not in seen:
                      seen.append(r)
          print("\n".join(seen))
          PY
          )
          echo "Cloning ${#REPOS[@]} sibling repos @ staging (fallback main)..."
          for r in "${REPOS[@]}"; do
            git clone --depth=1 -b staging \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || git clone --depth=1 -b main \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || echo "WARN: could not clone $r (uv will fail loudly if it is a required sibling)"
          done
          echo "Assembled workspace:" && ls -d ./*/

      - name: Check SIT readiness prerequisites (advisory)
        run: |
          # Codex now lives inside the PM clone (../unified-trading-pm/codex); the archived
          # standalone unified-trading-codex repo no longer exists.
          if [ -d "../unified-trading-pm/codex/10-audit/repos" ]; then
            python3 scripts/check-sit-readiness.py \
              --codex-path ../unified-trading-pm/codex/10-audit/repos \
              2>&1 || true
          else
            echo "::warning::codex readiness checklists not available — skipping readiness prereq check"
          fi

      - name: Install dependencies
        run: |
          uv pip install -e "." --system --quiet

      - name: Run code tests (static, no live services)
        id: code_tests
        env:
          # slice_mode=targeted → restrict to affected repos via -k; BROAD → no restriction.
          SLICE_MODE: ${{ needs.setup.outputs.slice_mode }}
          PYTEST_FILTER: ${{ needs.setup.outputs.pytest_filter }}
        run: |
          # Build -k filter: targeted mode uses the dep-slice expression; BROAD runs all.
          K_ARG=""
          if [ "$SLICE_MODE" = "targeted" ] && [ -n "$PYTEST_FILTER" ]; then
            K_ARG="-k $PYTEST_FILTER"
          fi

          pytest tests/ \
            -m "code_test" -v --tb=short --no-header \
            -q --json-report --json-report-file=code_tests_report.json \
            $K_ARG \
            2>&1 | tee code_tests_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run UAC internal-contract adoption check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          # #362: UIC was folded into unified_api_contracts.internal — the standalone
          # unified-internal-contracts repo is archived. Repoint to UAC + its check_uac_adoption.py
          # (same --orphans-only/--workspace interface).
          git clone --depth=1 --filter=blob:none \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-api-contracts.git" \
            /tmp/uac-check --sparse
          # --no-cone (with leading-slash-anchored patterns): `sparse-checkout set` defaults to
          # CONE mode, which treats every arg as a DIRECTORY and HARD-FAILS on a file path
          # ("fatal: 'scripts/check_uac_adoption.py' is not a directory"). The #362 repoint to
          # UAC added two FILE paths → cone-mode aborted the clone (exit 128) → the Code-Tests
          # job died before running, dispatching sit-failed every SIT run and jamming the
          # breaking-cascade staging lock (incident 2026-06-07, sit_retry_count hit max=3).
          # #375 (re-hardened 2026-06-10): ALSO sparse-checkout the UAC package __init__.py so
          # check_uac_adoption.py's get_uac_all() can read __all__ from the /tmp/uac-check clone
          # itself (its _resolve_uac_init() falls back to the script's own repo root). Without it
          # the scanner crashed with FileNotFoundError (UAC absent from workspace/) → the prior
          # NON-FATAL hack. internal/ stays for check_uac_completeness.py.
          git -C /tmp/uac-check sparse-checkout set --no-cone \
            /unified_api_contracts/ \
            /scripts/check_uac_adoption.py /scripts/check_uac_completeness.py

          # #375: derive the importer set from the PM manifest (type∈{service,batch-service,api-service}
          # AND status==active) instead of a hardcoded list that cloned 10 dead/consolidated repos.
          # check_uac_adoption.py now derives the SAME set internally from the manifest, so we lay
          # the manifest down at workspace/unified-trading-pm/ (its first _resolve_manifest() candidate)
          # AND still pre-clone the consumer repos into workspace/ for the grep scan.
          mkdir -p workspace/unified-trading-pm
          curl -sL \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/contents/workspace-manifest.json" \
            > workspace/unified-trading-pm/workspace-manifest.json
          SERVICES=$(python3 -c "
          import json
          m = json.load(open('workspace/unified-trading-pm/workspace-manifest.json'))
          ok = {'service', 'batch-service', 'api-service'}
          print(' '.join(
              name for name, meta in m.get('repositories', {}).items()
              if not name.startswith('_') and meta.get('type') in ok and meta.get('status') == 'active'
          ))")
          echo "Active code repos for adoption scan: ${SERVICES}"

          for svc in ${SERVICES}; do
            git clone --depth=1 --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${svc}.git" \
              "workspace/${svc}" 2>/dev/null \
              || echo "WARN: ${svc} not found — skipping"
          done

          # CAP-BASED regression guard (corrected 2026-06-10). The stale-TERMINAL_CONSUMER_SERVICES
          # root cause IS fixed (check_uac_adoption.py now derives the consumer set from the manifest
          # type∈{service,batch-service,api-service}+status==active filter) and UAC's __init__.py is
          # in the sparse-checkout so get_uac_all() no longer crashes. BUT the honest orphan count
          # with the corrected 11-service list is ~328 (fixing the list trimmed 364→328, NOT →0): UAC
          # carries hundreds of internal/registry/enum schemas that terminal services consume
          # TRANSITIVELY (via unified-trading-library re-exports / facade imports) which the
          # by-class-name grep cannot see, so they score "orphaned". An exit-1-on-ANY-orphan would
          # FAIL the SIT gate on these 328 and re-block the whole promotion cascade. So: WARN with the
          # count; the authoritative ratchet is pytest test_uac_orphan_count_under_cap (ORPHAN_CAP=400);
          # this step fails ONLY if the count blows past a generous hard ceiling = a real adoption
          # regression. Deeper fix (widen consumer set / follow facade re-exports to drive 328 down) is
          # a follow-up. Tracked:
          # unified-trading-pm/plans/active/issues/sit_uac_orphan_cap_stale_consumer_list_2026_06_07.md
          ORPHAN_HARD_CEILING=450
          set +e
          python3 /tmp/uac-check/scripts/check_uac_adoption.py \
            --orphans-only --workspace workspace \
            2>&1 | tee uac_adoption_orphans.txt
          set -e
          ORPHAN_COUNT=$(grep -c . uac_adoption_orphans.txt || echo 0)
          if [ "${ORPHAN_COUNT}" -gt "${ORPHAN_HARD_CEILING}" ]; then
            echo "::error::UAC adoption orphan count ${ORPHAN_COUNT} exceeds hard ceiling ${ORPHAN_HARD_CEILING} — a real adoption regression. See uac_adoption_orphans.txt artifact."
            exit 1
          fi
          echo "::warning::UAC adoption: ${ORPHAN_COUNT} orphaned schema(s) (expected ~328 baseline; many transitive-via-UTL/facade, not dead schemas). pytest ORPHAN_CAP=400 is the ratchet; hard ceiling ${ORPHAN_HARD_CEILING}."

      - name: Upload code test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-tests-report
          path: |
            code_tests_report.json
            code_tests_output.txt
            uac_adoption_orphans.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (code-tests failure)."

  deployment-tests:
    name: Deployment Tests (docker-compose mock stack)
    runs-on: [self-hosted, glue]
    needs: [setup, code-tests]
    # slice_mode EXEMPT = PM-only change; SIT must not run. Otherwise full-mode gate proceeds.
    if: |
      needs.setup.outputs.has_v1_repos == 'true' &&
      needs.setup.outputs.sit_mode == 'full' &&
      needs.setup.outputs.slice_mode != 'EXEMPT'
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUD_PROVIDER: local
      CLOUD_MOCK_MODE: "true"
      PUBSUB_EMULATOR_HOST: localhost:8085
      STORAGE_EMULATOR_HOST: http://localhost:4443
      BIGQUERY_EMULATOR_HOST: localhost:9050
      DEPLOYMENT_API_URL: http://localhost:8001
      INSTRUMENTS_SERVICE_URL: http://localhost:8080
      ERA_URL: http://localhost:8002
      CRA_URL: http://localhost:8003
      MDA_URL: http://localhost:8004
      LIVE_SERVICES_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Pin staging: repository_dispatch/workflow_dispatch default to the repo default branch
          # (main); we always test the staging code that PM is gating for promotion.
          ref: staging

      # git clone (not actions/checkout) — checkout@v4 hard-refuses a `path:` OUTSIDE the
      # workspace ("Repository path '.../unified-trading-pm' is not under '.../system-integration-tests'"),
      # but the docker-compose steps below reference ../unified-trading-pm/docker/ as a SIBLING dir.
      # This step never ran before (deployment-tests only runs after code-tests passes, which was
      # blocked for weeks by the smoke-test-gate sparse-checkout bug), so the latent failure surfaced
      # only after that fix. Clone PM's docker/ sparsely into the sibling path like the other PM clones.
      - name: Checkout unified-trading-pm (docker-compose)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          rm -rf ../unified-trading-pm
          git clone --depth=1 --filter=blob:none --sparse \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            ../unified-trading-pm
          git -C ../unified-trading-pm sparse-checkout set --no-cone /docker/

      - name: Write v1 services env file for compose
        run: |
          echo "V1_REPOS=${{ needs.setup.outputs.v1_repos_json }}" > ../unified-trading-pm/docker/.env.v1
          echo "V1 repos for compose: ${{ needs.setup.outputs.v1_repos_json }}"

      - name: Clone v1 service repos for docker-compose build context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          V1_REPOS_JSON='${{ needs.setup.outputs.v1_repos_json }}'
          for REPO in $(echo "$V1_REPOS_JSON" | jq -r '.[]'); do
            if [ "$REPO" = "system-integration-tests" ] || [ "$REPO" = "unified-trading-pm" ]; then
              echo "Skipping $REPO (already checked out)"
              continue
            fi
            git clone --depth 1 -b staging \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" \
              "../${REPO}" 2>/dev/null \
              || echo "WARN: ${REPO} not found — skipping"
          done

      - name: Start mock docker-compose stack (v1 services)
        run: |
          docker compose \
            -f ../unified-trading-pm/docker/docker-compose.mock.yml \
            --profile v1 \
            up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      # `uv pip install -e .` resolves SIT's [tool.uv.sources] path=../<repo> editable deps from
      # disk. The v1-only clone above misses repos NOT in staging_versions (e.g. mtds, strategy,
      # alerting, client-reporting, unified-cloud-interface) and any below 0.1.0 (features-service)
      # — all still declared as editable path sources. Clone the FULL active manifest set as
      # siblings (skip any already present) so the install resolves every path source.
      - name: Assemble remaining sibling workspace (editable path deps)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          # PM is sparse-checked-out here (docker/ only) — clone a fresh full copy for the manifest.
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            /tmp/pm-manifest
          mapfile -t REPOS < <(python3 - <<'PY'
          import json
          m = json.load(open("/tmp/pm-manifest/workspace-manifest.json"))
          seen = []
          for lvl in m.get("topologicalOrder", {}).get("levels", []):
              for r in lvl.get("repos", []):
                  if r not in ("unified-trading-pm", "system-integration-tests") and r not in seen:
                      seen.append(r)
          print("\n".join(seen))
          PY
          )
          cd ..
          echo "Ensuring ${#REPOS[@]} sibling repos exist @ staging (fallback main)..."
          for r in "${REPOS[@]}"; do
            if [ -d "$r" ]; then
              echo "  $r already present — skipping"
              continue
            fi
            git clone --depth=1 -b staging \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || git clone --depth=1 -b main \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${r}.git" "$r" 2>/dev/null \
              || echo "WARN: could not clone $r (uv will fail loudly if it is a required sibling)"
          done
          echo "Assembled workspace:" && ls -d ./*/

      - name: Install dependencies
        run: |
          uv pip install -e "." --system --quiet

      - name: Run deployment tests (mock stack)
        id: deployment_tests
        env:
          # slice_mode=targeted → restrict to affected repos via -k; BROAD → no restriction.
          SLICE_MODE: ${{ needs.setup.outputs.slice_mode }}
          PYTEST_FILTER: ${{ needs.setup.outputs.pytest_filter }}
        run: |
          # Build -k filter: targeted mode uses the dep-slice expression; BROAD runs all.
          K_ARG=""
          if [ "$SLICE_MODE" = "targeted" ] && [ -n "$PYTEST_FILTER" ]; then
            K_ARG="-k $PYTEST_FILTER"
          fi

          pytest tests/ \
            -m "deployment_test" -v --tb=short --no-header \
            -q --json-report --json-report-file=deployment_tests_report.json \
            $K_ARG \
            2>&1 | tee deployment_tests_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Stop mock docker-compose stack
        if: always()
        run: |
          docker compose \
            -f ../unified-trading-pm/docker/docker-compose.mock.yml \
            --profile v1 \
            down --volumes --remove-orphans || true

      - name: Upload deployment test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-tests-report
          path: |
            deployment_tests_report.json
            deployment_tests_output.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (deployment-tests failure)."

  dispatch:
    name: Dispatch staging-validated
    runs-on: [self-hosted, glue]
    needs: [setup, abbreviated-tests, code-tests, deployment-tests]
    # Run if: has repos to test AND one of:
    #   (a) abbreviated path passed,
    #   (b) full path passed,
    #   (c) slice_mode == EXEMPT (PM-only change: tests skipped, but staging is still valid → promote)
    # The skipped abbreviated-tests/code-tests/deployment-tests jobs have result=='skipped',
    # which is allowed by the always() guard below.
    if: |
      always() &&
      needs.setup.outputs.has_v1_repos == 'true' &&
      (
        (needs.setup.outputs.sit_mode == 'abbreviated' && needs.setup.outputs.slice_mode != 'EXEMPT' && needs.abbreviated-tests.result == 'success') ||
        (needs.setup.outputs.sit_mode == 'full' && needs.setup.outputs.slice_mode != 'EXEMPT' && needs.code-tests.result == 'success' && needs.deployment-tests.result == 'success') ||
        needs.setup.outputs.slice_mode == 'EXEMPT'
      )
    permissions:
      contents: write

    steps:
      - name: Clear hotfix_mode in PM manifest (if set)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          SIT_MODE="${{ needs.setup.outputs.sit_mode }}"

          if [ "$SIT_MODE" = "abbreviated" ]; then
            # Dispatch clear-hotfix-mode event to PM so manifest is cleaned up
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
              -d '{"event_type": "clear-hotfix-mode"}' || true
            echo "clear-hotfix-mode dispatched to PM."
          fi

      - name: Resolve staging commit SHA (dispatch runs from default branch)
        id: staging_sha
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${{ github.repository }}/commits/staging" -q .sha)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved staging SHA: ${SHA}"

      - name: Dispatch staging-validated to unified-trading-pm
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PAT }}
          repository: IggyIkenna/unified-trading-pm
          event-type: staging-validated
          # branch/commit are informational (staging-to-main is manifest-driven). Pinned to the
          # real staging SHA because github.sha resolves to main under repository_dispatch.
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "branch": "staging",
              "commit": "${{ steps.staging_sha.outputs.sha }}",
              "run_id": "${{ github.run_id }}",
              "trigger_event": "${{ github.event_name }}",
              "sit_mode": "${{ needs.setup.outputs.sit_mode }}",
              "slice_mode": "${{ needs.setup.outputs.slice_mode }}",
              "slice_repos": ${{ needs.setup.outputs.slice_repos_json || '[]' }}
            }

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Gate FAILED — staging-validated NOT dispatched to PM"
          echo "::error::Staging branch will NOT be promoted to main until all gates pass"
          exit 1
