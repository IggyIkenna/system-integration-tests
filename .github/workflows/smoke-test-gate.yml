name: Smoke Test Gate

# Triggers on push to staging branch; on success dispatches staging-validated
# to unified-trading-pm so PM can promote repos staging→main in tier order.
# Part of the staging-to-main automation:
#   service repo → staging → (this workflow) → PM staging-to-main.yml → main
#
# Jobs:
#   smoke-tests              — Layer 3a: pytest smoke/ + integration/ (import-only, no services)
#   contract-adoption-check  — UIC __all__ adoption scan: shallow-clones 18 terminal consumer
#                              services and runs check_uic_adoption.py; exits 1 if any orphan
#   dispatch                 — fires staging-validated to PM only when both jobs pass

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"

concurrency:
  group: sit-staging
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: Layer 3a Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Service URLs — use sandbox/mock values in CI (real values injected at deploy time)
      INSTRUMENTS_SERVICE_URL: ${{ vars.INSTRUMENTS_SERVICE_URL || 'http://localhost:8080' }}
      DEPLOYMENT_API_URL: ${{ vars.DEPLOYMENT_API_URL || 'http://localhost:8001' }}
      ERA_URL: ${{ vars.ERA_URL || 'http://localhost:8002' }}
      CRA_URL: ${{ vars.CRA_URL || 'http://localhost:8003' }}
      MDA_URL: ${{ vars.MDA_URL || 'http://localhost:8004' }}
      GCS_TEST_BUCKET: ${{ vars.GCS_TEST_BUCKET || '' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || '' }}

    steps:
      - name: SIT debounce (10-min quiet period)
        run: |
          echo "Waiting 600s quiet period — new staging push will cancel this run via concurrency group."
          sleep 600

      - name: Lock staging (dispatch sit-lock to PM)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          # Read staging_commits from PM manifest
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" /tmp/pm-repo
          COMMIT_SHAS=$(python3 -c "
          import json
          with open('/tmp/pm-repo/workspace-manifest.json') as f:
              m = json.load(f)
          commits = {k: v for k, v in m.get('staging_commits', {}).items() if not k.startswith('_')}
          print(json.dumps(commits))
          ")

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"sit-lock\", \"client_payload\": {\"commit_shas\": ${COMMIT_SHAS}}}"
          echo "SIT lock dispatched to PM."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Authenticate to GCP Artifact Registry
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          pip install uv --quiet
          uv pip install -e ".[dev]" --system --quiet

      - name: Run Layer 3a smoke + integration tests
        id: smoke
        run: |
          pytest tests/smoke/ tests/integration/ \
            -m "smoke or integration" -v --tb=short --no-header \
            -q --json-report --json-report-file=smoke_report.json \
            2>&1 | tee smoke_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: |
            smoke_report.json
            smoke_output.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM."

  contract-adoption-check:
    name: UIC + UAC + UTL Contract Adoption Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout unified-internal-contracts
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-internal-contracts
          token: ${{ secrets.GH_PAT }}
          path: workspace/unified-internal-contracts
          # __init__.py + adoption + completeness scripts + full source for AST scan
          sparse-checkout: |
            unified_internal_contracts/
            scripts/check_uic_adoption.py
            scripts/check_uic_completeness.py
          sparse-checkout-cone-mode: false

      - name: Checkout unified-api-contracts
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-api-contracts
          token: ${{ secrets.GH_PAT }}
          path: workspace/unified-api-contracts
          # __init__.py + adoption + completeness scripts + scoped source for AST scan
          sparse-checkout: |
            unified_api_contracts/__init__.py
            unified_api_contracts/schemas/
            unified_api_contracts/unified_normalised_contracts/
            unified_api_contracts/trading_schemas.py
            unified_api_contracts/canonical_mappings.py
            scripts/check_uac_adoption.py
            scripts/check_uac_completeness.py
          sparse-checkout-cone-mode: false

      - name: Checkout unified-trading-library
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-library
          token: ${{ secrets.GH_PAT }}
          path: workspace/unified-trading-library
          sparse-checkout: |
            unified_trading_library/__init__.py
            scripts/check_utl_adoption.py
          sparse-checkout-cone-mode: false

      - name: Shallow-clone terminal consumer services
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p workspace
          SERVICES=(
            execution-service
            strategy-service
            market-data-processing-service
            market-tick-data-service
            market-data-api
            instruments-service
            alerting-service
            risk-and-exposure-service
            position-balance-monitor-service
            pnl-attribution-service
            ml-inference-service
            ml-training-service
            features-delta-one-service
            features-volatility-service
            features-cross-instrument-service
            features-onchain-service
            features-sports-service
            features-calendar-service
            unified-market-interface
            unified-sports-execution-interface
          )
          MISSING=()
          for svc in "${SERVICES[@]}"; do
            echo "Cloning ${svc}..."
            git clone --depth=1 --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/IggyIkenna/${svc}.git" \
              "workspace/${svc}" 2>/dev/null \
              || { echo "WARN: ${svc} not found — skipping"; MISSING+=("${svc}"); }
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::${#MISSING[@]} service repo(s) not found: ${MISSING[*]}"
          fi

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run UIC adoption check
        run: |
          python3 workspace/unified-internal-contracts/scripts/check_uic_adoption.py \
            --orphans-only \
            --workspace workspace \
            2>&1 | tee uic_adoption_orphans.txt
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            ORPHAN_COUNT=$(wc -l < uic_adoption_orphans.txt | tr -d ' ')
            echo "::error::${ORPHAN_COUNT} orphaned UIC schema(s) have no terminal consumer importer."
            echo "::error::These contracts exist in UIC __all__ but are not imported by any terminal service."
            echo "::error::Either wire them into a service or remove them from UIC __all__."
            echo "::error::See uic_adoption_orphans.txt artifact for the full list."
            exit 1
          fi
          echo "All UIC schemas have at least one terminal consumer importer."

      - name: Run UAC adoption check
        run: |
          python3 workspace/unified-api-contracts/scripts/check_uac_adoption.py \
            --orphans-only \
            --workspace workspace \
            2>&1 | tee uac_adoption_orphans.txt
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            ORPHAN_COUNT=$(wc -l < uac_adoption_orphans.txt | tr -d ' ')
            echo "::error::${ORPHAN_COUNT} orphaned UAC schema(s) have no terminal consumer importer."
            echo "::error::These contracts exist in UAC __all__ but are not imported by any terminal service."
            echo "::error::Either wire them into a service or remove them from UAC __all__."
            echo "::error::See uac_adoption_orphans.txt artifact for the full list."
            exit 1
          fi
          echo "All non-exempt UAC schemas have at least one terminal consumer importer."

      - name: Run UTL adoption check
        run: |
          python3 workspace/unified-trading-library/scripts/check_utl_adoption.py \
            --orphans-only \
            --workspace workspace \
            2>&1 | tee utl_adoption_orphans.txt
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            ORPHAN_COUNT=$(wc -l < utl_adoption_orphans.txt | tr -d ' ')
            echo "::error::${ORPHAN_COUNT} orphaned UTL symbol(s) have no terminal consumer importer."
            echo "::error::These symbols exist in UTL __all__ but are not imported by any terminal service."
            echo "::error::Either wire them into a service, add to EXEMPT_CLASSES, or remove from UTL __all__."
            echo "::error::See utl_adoption_orphans.txt artifact for the full list."
            exit 1
          fi
          echo "All non-exempt UTL symbols have at least one terminal consumer importer."

      - name: Run UIC completeness check (warn-mode)
        run: |
          python3 workspace/unified-internal-contracts/scripts/check_uic_completeness.py \
            --workspace workspace \
            2>&1 | tee uic_completeness_report.txt || true
          if grep -q "MISSING from __all__" uic_completeness_report.txt; then
            COUNT=$(grep -c "^  - " uic_completeness_report.txt || echo "?")
            echo "::warning::${COUNT} UIC public class(es) defined in source but missing from __all__."
            echo "::warning::See uic_completeness_report.txt — add to __all__ or mark exempt."
          else
            echo "UIC completeness: all non-exempt public classes are in __all__."
          fi

      - name: Run UAC completeness check (warn-mode)
        run: |
          python3 workspace/unified-api-contracts/scripts/check_uac_completeness.py \
            --workspace workspace \
            2>&1 | tee uac_completeness_report.txt || true
          if grep -q "MISSING from __all__" uac_completeness_report.txt; then
            COUNT=$(grep -c "^  - " uac_completeness_report.txt || echo "?")
            echo "::warning::${COUNT} UAC public class(es) defined in core source but missing from __all__."
            echo "::warning::See uac_completeness_report.txt — add to __all__ or mark exempt."
          else
            echo "UAC completeness: all non-exempt public core classes are in __all__."
          fi

      - name: Upload adoption orphans reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adoption-orphans-report
          path: |
            uic_adoption_orphans.txt
            uac_adoption_orphans.txt
            utl_adoption_orphans.txt
            uic_completeness_report.txt
            uac_completeness_report.txt
          retention-days: 7

  dispatch:
    name: Dispatch staging-validated
    runs-on: ubuntu-latest
    needs: [smoke-tests, contract-adoption-check]
    if: success()
    permissions:
      contents: read

    steps:
      - name: Dispatch staging-validated to unified-trading-pm
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: IggyIkenna/unified-trading-pm
          event-type: staging-validated
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Gate FAILED — staging-validated NOT dispatched to PM"
          echo "::error::Staging branch will NOT be promoted to main until all gates pass"
          exit 1
