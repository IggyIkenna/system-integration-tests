name: Smoke Test Gate

# Triggers on push to staging branch; on success dispatches staging-validated
# to unified-trading-pm so PM can promote repos staging→main in tier order.
#
# Part of the staging-to-main automation:
#   service repo → staging → (this workflow) → PM staging-to-main.yml → main
#
# SIT VERSION SCOPE: Only repos with staging_versions[repo] >= 1.0.0 are tested.
# If no such repos exist on staging, the workflow exits immediately (no lock dispatched).
#
# SIT MODE:
#   full (default) — code-tests + deployment-tests; full contract + integration suite
#   abbreviated    — tests/abbreviated/ only (<2 min schema checks); used for hotfix path
#                    and repos with sit_level=abbreviated in PM manifest (e.g. PM, Codex)
#
# Hotfix detection: PM manifest staging_status.hotfix_mode=true (set by quickmerge --hotfix)
# sit_level detection: PM manifest repositories[repo].sit_level (abbreviated|standard)
#
# Jobs:
#   setup               — reads staging_versions, hotfix_mode, sit_level; sets skip/mode guard
#   abbreviated-tests   — runs tests/abbreviated/ -m abbreviated_sit (<2 min); hotfix/abbreviated path
#   code-tests          — Layer 3a: static tests, no live services required (<10 min); full path only
#   deployment-tests    — Layer 3b/3c: tests requiring docker-compose mock stack; full path only
#   dispatch            — fires staging-validated to PM; clears hotfix_mode if set

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual trigger reason"
        required: false
        default: "manual"
      sit_mode:
        description: "SIT mode: full or abbreviated"
        required: false
        default: "full"

concurrency:
  group: sit-staging
  cancel-in-progress: true

jobs:
  setup:
    name: SIT Setup (v1 repo filter + mode detection)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_v1_repos: ${{ steps.filter.outputs.has_v1_repos }}
      v1_repos_json: ${{ steps.filter.outputs.v1_repos_json }}
      sit_mode: ${{ steps.filter.outputs.sit_mode }}

    steps:
      - name: SIT debounce (10-min quiet period — skipped for abbreviated/hotfix)
        run: |
          # Skip debounce if workflow_dispatch with sit_mode=abbreviated
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sit_mode }}" = "abbreviated" ]; then
            echo "Abbreviated mode — skipping debounce."
          else
            echo "Waiting 600s quiet period — new staging push will cancel this run via concurrency group."
            sleep 600
          fi

      - name: Clone PM manifest and filter v1 repos + detect SIT mode
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_SIT_MODE: ${{ inputs.sit_mode || 'full' }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            /tmp/pm-repo

          python3 - <<'PYEOF'
          import json
          import sys
          import os
          from pathlib import Path

          try:
              from packaging.version import Version
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "packaging", "-q"])
              from packaging.version import Version

          manifest = json.loads(Path("/tmp/pm-repo/workspace-manifest.json").read_text())
          staging_versions = manifest.get("staging_versions", {})
          staging_status = manifest.get("staging_status", {})
          repositories = manifest.get("repositories", {})

          # Detect SIT mode: hotfix_mode in staging_status OR workflow_dispatch input OR
          # all promoted repos have sit_level=abbreviated
          hotfix_mode = staging_status.get("hotfix_mode", False)
          dispatch_mode = os.environ.get("DISPATCH_SIT_MODE", "full")

          # Check if all repos on staging have sit_level=abbreviated
          staging_repos = [r for r in staging_versions if not r.startswith("_")]
          all_abbreviated = all(
              repositories.get(r, {}).get("sit_level", "standard") == "abbreviated"
              for r in staging_repos
          ) if staging_repos else False

          sit_mode = "full"
          if hotfix_mode or dispatch_mode == "abbreviated" or all_abbreviated:
              sit_mode = "abbreviated"
              reason = "hotfix_mode" if hotfix_mode else ("all_abbreviated" if all_abbreviated else "dispatch_input")
              print(f"SIT mode: abbreviated (reason: {reason})")
          else:
              print("SIT mode: full")

          v1_repos = [
              repo for repo, ver in staging_versions.items()
              if not repo.startswith("_") and Version(ver) >= Version("1.0.0")
          ]

          # For abbreviated mode, include all staging repos (not just v1)
          if sit_mode == "abbreviated":
              active_repos = staging_repos
          else:
              active_repos = v1_repos

          if not active_repos and sit_mode == "full":
              print("No repos with staging_versions >= 1.0.0 found on staging. Skipping SIT.")
              with open("/tmp/filter_outputs.txt", "w") as f:
                  f.write("has_v1_repos=false\n")
                  f.write("v1_repos_json=[]\n")
                  f.write(f"sit_mode={sit_mode}\n")
              sys.exit(0)

          print(f"Active repos for SIT ({sit_mode}): {active_repos}")
          with open("/tmp/filter_outputs.txt", "w") as f:
              f.write("has_v1_repos=true\n")
              f.write(f"v1_repos_json={json.dumps(active_repos)}\n")
              f.write(f"sit_mode={sit_mode}\n")
          PYEOF

          # Write outputs to GITHUB_OUTPUT
          if [ -f /tmp/filter_outputs.txt ]; then
            cat /tmp/filter_outputs.txt >> "$GITHUB_OUTPUT"
          else
            echo "has_v1_repos=false" >> "$GITHUB_OUTPUT"
            echo "v1_repos_json=[]" >> "$GITHUB_OUTPUT"
            echo "sit_mode=full" >> "$GITHUB_OUTPUT"
          fi

  abbreviated-tests:
    name: Abbreviated SIT (contract + workflow sanity, <2 min)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_v1_repos == 'true' && needs.setup.outputs.sit_mode == 'abbreviated'
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Install dependencies
        run: |
          uv pip install -e . --system --quiet

      - name: Run abbreviated SIT (contract normalization + workflow sanity)
        run: |
          pytest tests/abbreviated/ \
            -m "abbreviated_sit" -v --tb=short --no-header \
            --timeout=120 \
            -q --json-report --json-report-file=abbreviated_sit_report.json \
            2>&1 | tee abbreviated_sit_output.txt

      - name: Upload abbreviated SIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abbreviated-sit-report
          path: |
            abbreviated_sit_report.json
            abbreviated_sit_output.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (abbreviated-tests failure)."

  code-tests:
    name: Code Tests (static, <10 min)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has_v1_repos == 'true' && needs.setup.outputs.sit_mode == 'full'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Lock staging (dispatch sit-lock to PM)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"

          # Read staging_commits from PM manifest (cloned in setup job)
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/unified-trading-pm.git" \
            /tmp/pm-repo-lock

          COMMIT_SHAS=$(python3 -c "
          import json
          with open('/tmp/pm-repo-lock/workspace-manifest.json') as f:
              m = json.load(f)
          commits = {k: v for k, v in m.get('staging_commits', {}).items() if not k.startswith('_')}
          print(json.dumps(commits))
          ")

          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"sit-lock\", \"client_payload\": {\"commit_shas\": ${COMMIT_SHAS}}}"
          echo "SIT lock dispatched to PM."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unified-trading-codex (readiness checklists)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-codex
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-codex
        continue-on-error: true

      - name: Check SIT readiness prerequisites (advisory)
        run: |
          if [ -d "../unified-trading-codex/10-audit/repos" ]; then
            python3 scripts/check-sit-readiness.py \
              --codex-path ../unified-trading-codex/10-audit/repos \
              2>&1 || true
          else
            echo "::warning::unified-trading-codex not available — skipping readiness prereq check"
          fi

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]" --system --quiet

      - name: Run code tests (static, no live services)
        id: code_tests
        run: |
          pytest tests/ \
            -m "code_test" -v --tb=short --no-header \
            -q --json-report --json-report-file=code_tests_report.json \
            2>&1 | tee code_tests_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run UIC contract adoption check
        run: |
          git clone --depth=1 --filter=blob:none \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/IggyIkenna/unified-internal-contracts.git" \
            /tmp/uic-check --sparse
          git -C /tmp/uic-check sparse-checkout set \
            unified_internal_contracts/ scripts/check_uic_adoption.py scripts/check_uic_completeness.py

          mkdir -p workspace
          SERVICES=(
            execution-service strategy-service market-data-processing-service
            market-tick-data-service market-data-api instruments-service
            alerting-service risk-and-exposure-service position-balance-monitor-service
            pnl-attribution-service ml-inference-service ml-training-service
            features-delta-one-service features-volatility-service
            features-cross-instrument-service features-onchain-service
            features-sports-service features-calendar-service
            unified-market-interface unified-sports-execution-interface
          )
          OWNER="${{ github.repository_owner }}"
          for svc in "${SERVICES[@]}"; do
            git clone --depth=1 --filter=blob:none \
              "https://x-access-token:${{ secrets.GH_PAT }}@github.com/IggyIkenna/${svc}.git" \
              "workspace/${svc}" 2>/dev/null \
              || echo "WARN: ${svc} not found — skipping"
          done

          python3 /tmp/uic-check/scripts/check_uic_adoption.py \
            --orphans-only --workspace workspace \
            2>&1 | tee uic_adoption_orphans.txt
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            ORPHAN_COUNT=$(wc -l < uic_adoption_orphans.txt | tr -d ' ')
            echo "::error::${ORPHAN_COUNT} orphaned UIC schema(s) have no terminal consumer importer."
            exit 1
          fi
          echo "All UIC schemas have at least one terminal consumer importer."

      - name: Upload code test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-tests-report
          path: |
            code_tests_report.json
            code_tests_output.txt
            uic_adoption_orphans.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (code-tests failure)."

  deployment-tests:
    name: Deployment Tests (docker-compose mock stack)
    runs-on: ubuntu-latest
    needs: [setup, code-tests]
    if: needs.setup.outputs.has_v1_repos == 'true' && needs.setup.outputs.sit_mode == 'full'
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUD_PROVIDER: local
      CLOUD_MOCK_MODE: "true"
      PUBSUB_EMULATOR_HOST: localhost:8085
      STORAGE_EMULATOR_HOST: http://localhost:4443
      BIGQUERY_EMULATOR_HOST: localhost:9050
      DEPLOYMENT_API_URL: http://localhost:8001
      INSTRUMENTS_SERVICE_URL: http://localhost:8080
      ERA_URL: http://localhost:8002
      CRA_URL: http://localhost:8003
      MDA_URL: http://localhost:8004
      LIVE_SERVICES_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout unified-trading-pm (docker-compose)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-pm
          token: ${{ secrets.GH_PAT }}
          path: ../unified-trading-pm
          sparse-checkout: |
            docker/
          sparse-checkout-cone-mode: false

      - name: Write v1 services env file for compose
        run: |
          echo "V1_REPOS=${{ needs.setup.outputs.v1_repos_json }}" > ../unified-trading-pm/docker/.env.v1
          echo "V1 repos for compose: ${{ needs.setup.outputs.v1_repos_json }}"

      - name: Clone v1 service repos for docker-compose build context
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPOS=(market-data-service execution-service trading-analytics-api)
          for REPO in "${REPOS[@]}"; do
            git clone --depth 1 -b staging \
              "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" \
              "../${REPO}"
          done

      - name: Start mock docker-compose stack (v1 services)
        run: |
          docker compose \
            -f ../unified-trading-pm/docker/docker-compose.mock.yml \
            --profile v1 \
            up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]" --system --quiet

      - name: Run deployment tests (mock stack)
        id: deployment_tests
        run: |
          pytest tests/ \
            -m "deployment_test" -v --tb=short --no-header \
            -q --json-report --json-report-file=deployment_tests_report.json \
            2>&1 | tee deployment_tests_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Stop mock docker-compose stack
        if: always()
        run: |
          docker compose \
            -f ../unified-trading-pm/docker/docker-compose.mock.yml \
            --profile v1 \
            down --volumes --remove-orphans || true

      - name: Upload deployment test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-tests-report
          path: |
            deployment_tests_report.json
            deployment_tests_output.txt
          retention-days: 7

      - name: Unlock staging on failure (dispatch sit-failed to PM)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OWNER="${{ github.repository_owner }}"
          curl -s -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
            -d '{"event_type": "sit-failed"}'
          echo "sit-failed dispatched to PM (deployment-tests failure)."

  dispatch:
    name: Dispatch staging-validated
    runs-on: ubuntu-latest
    needs: [setup, abbreviated-tests, code-tests, deployment-tests]
    # Run if: has repos to test AND (abbreviated path passed OR full path passed)
    if: |
      always() &&
      needs.setup.outputs.has_v1_repos == 'true' &&
      (
        (needs.setup.outputs.sit_mode == 'abbreviated' && needs.abbreviated-tests.result == 'success') ||
        (needs.setup.outputs.sit_mode == 'full' && needs.code-tests.result == 'success' && needs.deployment-tests.result == 'success')
      )
    permissions:
      contents: write

    steps:
      - name: Clear hotfix_mode in PM manifest (if set)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          SIT_MODE="${{ needs.setup.outputs.sit_mode }}"

          if [ "$SIT_MODE" = "abbreviated" ]; then
            # Dispatch clear-hotfix-mode event to PM so manifest is cleaned up
            curl -s -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/unified-trading-pm/dispatches" \
              -d '{"event_type": "clear-hotfix-mode"}' || true
            echo "clear-hotfix-mode dispatched to PM."
          fi

      - name: Dispatch staging-validated to unified-trading-pm
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: IggyIkenna/unified-trading-pm
          event-type: staging-validated
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}",
              "sit_mode": "${{ needs.setup.outputs.sit_mode }}"
            }

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Gate FAILED — staging-validated NOT dispatched to PM"
          echo "::error::Staging branch will NOT be promoted to main until all gates pass"
          exit 1
