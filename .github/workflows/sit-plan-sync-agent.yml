name: SIT Plan Sync Agent

# Checks that todos in genuinely active PM plans reflect the actual state of
# system-integration-tests: test files exist for completed todos, failing tests
# are not marked completed, etc.
# Uses claude-haiku-4-5 (cheap, targeted).
#
# Triggers:
#   - push to main (test changes)
#   - daily 03:00 UTC
#   - manual workflow_dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, no PR comments"
        default: "false"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sit-plan-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      GH_ORG: IggyIkenna

    steps:
      - name: Checkout system-integration-tests
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Checkout unified-trading-pm (active plans)
        uses: actions/checkout@v4
        with:
          repository: IggyIkenna/unified-trading-pm
          token: ${{ secrets.GH_PAT }}
          path: unified-trading-pm
          sparse-checkout: |
            plans/active
          sparse-checkout-cone-mode: false

      - name: Setup agent CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-agent-tools@main

      - name: Configure git identity
        run: |
          git config --global user.email "agent@ci.local"
          git config --global user.name "SIT Plan Sync Agent"

      - name: Collect SIT test inventory
        id: inventory
        run: |
          # List all test files and their test function names
          echo "=== Test files ===" > sit-inventory.txt
          find . -name "test_*.py" -o -name "*_test.py" | grep -v ".git" | sort >> sit-inventory.txt
          echo "" >> sit-inventory.txt
          echo "=== Test functions ===" >> sit-inventory.txt
          grep -rh "^def test_\|^    def test_" --include="*.py" . | sort >> sit-inventory.txt 2>/dev/null || true
          echo "SIT test inventory written"
          cat sit-inventory.txt | head -30

      - name: Run SIT plan sync agent
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          PROMPT="You are the SIT plan sync agent for unified-trading-system. Follow these rules:
          - No chain-of-thought, no prose explanations
          - Output only: JSON summary of mismatches found
          - Be minimal and precise

          CONTEXT:
          You have access to:
          1. unified-trading-pm/plans/active/*.md — active PM plans with todos and statuses
          2. sit-inventory.txt — all test files and test functions in this repo
          3. The current directory is system-integration-tests/

          TASK — REALITY CHECK:
          For each active plan that mentions SIT, system-integration-tests, e2e, smoke tests, or integration tests:
          1. Find todos marked status: completed that claim a test was added/passing
             → Verify: does the test file/function exist in sit-inventory.txt?
             → If NOT: flag as 'completed-but-missing'
          2. Find todos marked status: pending that claim a test is not yet implemented
             → Verify: does a matching test function already exist?
             → If YES: flag as 'pending-but-exists'
          3. Find todos marked status: completed for a service integration
             → Check if there is at least one test file referencing that service

          Output format (JSON):
          {
            \"mismatches\": [
              {\"plan\": \"<filename>\", \"todo_id\": \"<id>\", \"status\": \"<current>\", \"issue\": \"<completed-but-missing|pending-but-exists>\", \"detail\": \"<one line>\"}
            ],
            \"healthy_plans\": [\"<plan_filename>\", ...],
            \"summary\": \"<one sentence>\"
          }

          If mismatches found and DRY_RUN != 'true':
          Post a GitHub issue comment or create a tracking issue:
            gh issue create --repo ${GH_ORG}/unified-trading-pm \\
              --title 'SIT Plan Sync: status mismatches found' \\
              --body '<JSON output above>' \\
              --label 'plan-health'

          DRY_RUN=${DRY_RUN}"

          claude --print --dangerously-skip-permissions --model claude-haiku-4-5-20251001 "$PROMPT" \
            || echo "SIT plan sync agent exited non-zero — check logs"

      - name: Skip — no API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set — skipping SIT plan sync agent"

      - name: Notify Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "⚠️")
          TEXT="${ICON} *sit-plan-sync-agent* | ${STATUS} | SIT vs PM plans checked"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${TEXT}" \
            -d parse_mode="Markdown" || true
