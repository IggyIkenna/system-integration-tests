# full-workspace-sit.yml — Tier B: the continuous cross-repo SIT layer.
#
# WHY (full_cicd_sit_target_state_2026_05_24.md § Tier B): per-repo workspace-qg renders a
# partial dep_repos set, so cross-repo invariants (feature-DAG SSOT, cassette↔consumer linkage,
# data_type canonicalization) SKIP — they run NOWHERE continuously. This job assembles the FULL
# active workspace (all repos from workspace-manifest.json topologicalOrder as siblings) and runs
# the cross-repo invariant suite (scripts/run_cross_repo_invariants.sh), which fails on any
# invariant failure OR on a skip (a skip == workspace not assembled == the bug this layer catches).
#
# WHAT `SIT_VALIDATED` ACTUALLY MEANS (corrected 2026-07-29, over-claim fix per
# uac_value_only_config_change_breaks_utl_untested_2026_07_20.md): this job is an API-SURFACE
# check, NOT a full integration test run. It installs ONLY unified-api-contracts (see "Install
# unified-api-contracts" below) — every other sibling repo is cloned but never installed, never
# imported, and its own test suite is never collected. The invariants assert cross-repo contract
# shape (export names, schema/signature compatibility, cassette↔consumer linkage, data_type
# canonicalization) — they do NOT prove "the resolved cross-repo combination works" or that a
# dependent's behavior is correct on the new tree, only that its declared surface still matches.
# A value-only change (e.g. a config constant whose NAME is unchanged but VALUE differs) can pass
# SIT_VALIDATED while still breaking a consumer at runtime — this is a known, accepted gap, not a
# bug in this job; downstream readers of `ci_status=SIT_VALIDATED` must not treat it as proof a
# dependent repo's tests were executed.
#
# Cadence: nightly (03:00 UTC, offset from performance-test's 02:00) + manual + on-promotion
# (repository_dispatch [full-workspace-sit] fired by the Tier C promotion bot before it advances a
# live-defi-rollout → staging PR). A repo must not promote to staging while this is RED for its layer.
name: full-workspace-sit

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {}
  repository_dispatch:
    types: [full-workspace-sit]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross-repo-invariants:
    runs-on: [self-hosted, glue]
    timeout-minutes: 30
    steps:
      - name: Checkout system-integration-tests
        uses: actions/checkout@v5
        with:
          path: system-integration-tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Clone all active repos as siblings (topologicalOrder)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_ORG: IggyIkenna
          DEP_BRANCH: live-defi-rollout
        run: |
          set -euo pipefail
          # PM holds the manifest; clone it first.
          git clone --depth=1 -b "$DEP_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_ORG}/unified-trading-pm.git" \
            unified-trading-pm 2>/dev/null \
            || git clone --depth=1 -b main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_ORG}/unified-trading-pm.git" \
            unified-trading-pm
          # Enumerate every active repo from the manifest topologicalOrder (skip PM + this repo).
          mapfile -t REPOS < <(python3 - <<'PY'
          import json
          m = json.load(open("unified-trading-pm/workspace-manifest.json"))
          seen = []
          for lvl in m.get("topologicalOrder", {}).get("levels", []):
              for r in lvl.get("repos", []):
                  if r not in ("unified-trading-pm", "system-integration-tests") and r not in seen:
                      seen.append(r)
          print("\n".join(seen))
          PY
          )
          echo "Cloning ${#REPOS[@]} sibling repos @ ${DEP_BRANCH} (fallback main)..."
          for r in "${REPOS[@]}"; do
            git clone --depth=1 -b "$DEP_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/${GH_ORG}/${r}.git" "$r" 2>/dev/null \
              || git clone --depth=1 -b main \
              "https://x-access-token:${GH_TOKEN}@github.com/${GH_ORG}/${r}.git" "$r" 2>/dev/null \
              || echo "WARN: could not clone $r (skipping — runner will fail loudly if it is a required sibling)"
          done
          echo "Assembled workspace:" && ls -d */

      - name: Install unified-api-contracts (invariant tests import it)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          uv venv unified-api-contracts/.venv
          uv pip install --python unified-api-contracts/.venv/bin/python \
            -e unified-api-contracts pytest pyyaml

      - name: Run cross-repo invariant suite
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          UAC_PYTHON: ${{ github.workspace }}/unified-api-contracts/.venv/bin/python
        run: |
          set -uo pipefail
          bash system-integration-tests/scripts/run_cross_repo_invariants.sh

      # WS-L SIT-rehome STEP 2 (producer, Option B+ safe interim 2026-06-27): on a GREEN cross-repo run,
      # stamp ci_status=SIT_VALIDATED + LDR tree fingerprint ONLY for the repos the suite ACTUALLY
      # validates — workspace-manifest.json `sit_cross_repo_validated_repos` (mirror of this suite's
      # REQUIRED_SIBLINGS). The suite runs a small set of cross-repo invariants over those repos; the
      # other ldr_main repos are assembled but their public surface is NOT exercised, so stamping THEM
      # SIT_VALIDATED would forge a cross-repo guarantee (adversarial-caught: 5 validated vs 21 stamped).
      # The LDR→main fleet promoter consumes this to prove a BREAKING main..LDR delta was validated on
      # EXACTLY this content (sit_validated_tree == the promoted LDR tree). A breaking change in a
      # NON-covered repo stays conservatively BLOCKED on the promoter. Expanding coverage = add the repo
      # to REQUIRED_SIBLINGS + its invariant + the manifest list (the suite asserts the two match).
      - name: Stamp SIT_VALIDATED + LDR tree (WS-L SIT-rehome producer — covered repos only)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ORG: IggyIkenna
        run: |
          set -uo pipefail
          # Per-invariant isolation: read the per-repo results JSON written by
          # run_cross_repo_invariants.sh. If the file is absent (workspace-assembly
          # error before any invariant ran) skip all stamping. Only repos whose
          # per-repo invariant PASSED get SIT_VALIDATED — an unrelated red invariant
          # for repo B does not block repo A's stamp.
          _RESULTS=/tmp/sit_per_repo_results.json
          if [ ! -f "$_RESULTS" ]; then
            echo "No per-repo results file (invariant runner failed at workspace assembly) — skipping stamp."
            exit 0
          fi

          # The covered set is the SSOT for "what SIT actually validated" — read it from the manifest.
          mapfile -t COVERED < <(python3 -c "import json; print('\n'.join(json.load(open('unified-trading-pm/workspace-manifest.json')).get('sit_cross_repo_validated_repos', [])))")
          if [ "${#COVERED[@]}" -eq 0 ]; then echo "::error::sit_cross_repo_validated_repos empty in manifest — refusing to stamp (no coverage SSOT)"; exit 1; fi

          # Filter to repos that passed their per-repo invariants.
          mapfile -t STAMP_REPOS < <(python3 -c "
          import json
          results = json.load(open('$_RESULTS'))
          covered = json.load(open('unified-trading-pm/workspace-manifest.json')).get('sit_cross_repo_validated_repos', [])
          passed = [r for r in covered if results.get(r) == 'PASS']
          print('\n'.join(passed))
          ")
          if [ "${#STAMP_REPOS[@]}" -eq 0 ]; then
            echo "No repos passed per-repo invariants — skipping stamp."
            exit 0
          fi
          echo "SIT-covered repos: ${#COVERED[@]} total; stamping ${#STAMP_REPOS[@]} that passed: ${STAMP_REPOS[*]}"

          # ── Cross-repo combination fingerprint (HIGH-combo, Phase 2) ──────────────────────────────
          # Compute workspace digest = SHA-256 of all covered repos' LDR tree SHAs. Emitted
          # alongside sit_validated_tree so the consumer can detect when a DEPENDENCY changed after
          # SIT validated a dependent (per-repo tree match alone is insufficient — repo R validated
          # against UAC v1 can still pass if UAC v2 lands before R promotes). The consumer blocks
          # and re-dispatches SIT when digest mismatch is detected. Fail-open on absent digest
          # (legacy consumer behaviour) so the check applies progressively.
          printf '%s\n' "${COVERED[@]}" > /tmp/covered_repos.txt
          WORKSPACE_DIGEST=$(python3 -c "
          import hashlib, json, subprocess
          with open('/tmp/covered_repos.txt') as f:
              repos = [l.strip() for l in f if l.strip()]
          trees = {}
          for r in repos:
              res = subprocess.run(['git', '-C', r, 'rev-parse', 'HEAD^{tree}'], capture_output=True, text=True)
              tree = res.stdout.strip()
              if tree:
                  trees[r] = tree
          payload = json.dumps(trees, sort_keys=True, separators=(',', ':'))
          print(hashlib.sha256(payload.encode()).hexdigest())
          " 2>/dev/null || echo "")
          echo "Workspace digest (combination fingerprint): ${WORKSPACE_DIGEST:0:16}... (${#COVERED[@]} repos)"

          # Verified-stamp helper (2026-07-25 hardening, ci_status_firestore_write_permission_denied_fleet_wide):
          # a bare `curl ... && echo "stamped"` only proves GitHub ACCEPTED the repository_dispatch POST (HTTP
          # 204) — it says nothing about whether the downstream ci-status-update.yml run actually completed its
          # Firestore write. A ~3.5h fleet-wide Firestore-permission 403 made EVERY downstream write fail while
          # every dispatch POST kept succeeding, so this exact bare-curl pattern silently believed SIT_VALIDATED
          # was landing the whole time. Now: after dispatch, poll for the NEW ci-status-update.yml run this
          # dispatch created and wait for its terminal conclusion before declaring success; a run that fails, or
          # that can't be identified within the poll window, is a loud failure — never a silent "stamped".
          STAMP_FAILURES=()
          for r in "${STAMP_REPOS[@]}"; do
            [ -d "$r/.git" ] || { echo "skip $r (not assembled)"; continue; }
            # Defense-in-depth: only stamp a repo actually checked out on live-defi-rollout (the clone
            # may have fallen back to main; stamping a main tree would be wrong — though the consumer's
            # tree-equality check would also reject it).
            BR="$(git -C "$r" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")"
            if [ "$BR" != "live-defi-rollout" ]; then echo "skip $r (on '$BR', not live-defi-rollout)"; continue; fi
            SHA="$(git -C "$r" rev-parse HEAD 2>/dev/null || echo "")"
            TREE="$(git -C "$r" rev-parse 'HEAD^{tree}' 2>/dev/null || echo "")"
            if [ -z "$SHA" ] || [ -z "$TREE" ]; then echo "skip $r (no sha/tree)"; continue; fi

            # Snapshot existing ci-status-update.yml run IDs BEFORE dispatch so the NEW run this
            # dispatch creates can be identified (repository_dispatch has no synchronous run-id
            # response — GitHub's dispatches endpoint returns a bare 204).
            PRE_RUN_IDS=" $(curl -s -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/actions/workflows/ci-status-update.yml/runs?per_page=10" \
              | python3 -c "import sys,json; print(' '.join(str(x['id']) for x in json.load(sys.stdin).get('workflow_runs', [])))" 2>/dev/null) "

            DISPATCH_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/dispatches" \
              -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${r}\", \"status\": \"SIT_VALIDATED\", \"branch\": \"live-defi-rollout\", \"sha\": \"${SHA}\", \"sit_validated_tree\": \"${TREE}\", \"sit_validated_workspace_digest\": \"${WORKSPACE_DIGEST}\"}}")
            if [ "$DISPATCH_HTTP" != "204" ]; then
              echo "::error::dispatch POST for ${r} returned HTTP ${DISPATCH_HTTP} (expected 204) — SIT_VALIDATED NOT stamped"
              STAMP_FAILURES+=("${r}:dispatch-http-${DISPATCH_HTTP}")
              continue
            fi

            # Poll (up to ~30s) for a run id NOT in PRE_RUN_IDS — that's the run our dispatch created.
            NEW_RUN_ID=""
            for _ in $(seq 1 6); do
              sleep 5
              CANDIDATES=$(curl -s -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/actions/workflows/ci-status-update.yml/runs?per_page=10" \
                | python3 -c "import sys,json; print(' '.join(str(x['id']) for x in json.load(sys.stdin).get('workflow_runs', [])))" 2>/dev/null)
              for id in $CANDIDATES; do
                case "$PRE_RUN_IDS" in *" $id "*) continue ;; esac
                NEW_RUN_ID="$id"
                break 2
              done
            done
            if [ -z "$NEW_RUN_ID" ]; then
              echo "::error::could not identify the ci-status-update.yml run dispatched for ${r} within 30s — treating as unverified"
              STAMP_FAILURES+=("${r}:run-not-found")
              continue
            fi

            # Poll (up to ~90s; observed run duration ~15-130s) the identified run to a terminal status.
            CONCLUSION=""
            for _ in $(seq 1 18); do
              RUN_JSON=$(curl -s -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${GH_ORG}/unified-trading-pm/actions/runs/${NEW_RUN_ID}" 2>/dev/null || echo "{}")
              RUN_STATUS=$(printf '%s' "$RUN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
              if [ "$RUN_STATUS" = "completed" ]; then
                CONCLUSION=$(printf '%s' "$RUN_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('conclusion',''))" 2>/dev/null || echo "")
                break
              fi
              sleep 5
            done

            if [ "$CONCLUSION" = "success" ]; then
              echo "stamped SIT_VALIDATED ${r} @ ${SHA} (tree ${TREE}, ws_digest ${WORKSPACE_DIGEST:0:12}..., verified via ci-status-update run ${NEW_RUN_ID})"
            else
              echo "::error::ci-status-update run ${NEW_RUN_ID} for ${r} did not succeed (conclusion=${CONCLUSION:-unknown/timeout}) — SIT_VALIDATED write NOT confirmed"
              STAMP_FAILURES+=("${r}:run-${NEW_RUN_ID}-conclusion-${CONCLUSION:-unknown}")
            fi
          done

          if [ "${#STAMP_FAILURES[@]}" -gt 0 ]; then
            echo "::error::${#STAMP_FAILURES[@]} stamp verification failure(s): ${STAMP_FAILURES[*]}"
            exit 1
          fi

      # MISSING LINK FIX (2026-06-10): the SIT result never reached PM — sit-unlock listens for
      # sit-passed/sit-failed repository_dispatch events that NOTHING sent, so a green SIT left
      # staging locked forever and a red SIT never opened staging for fixes. Close the loop.
      #
      # CANCELLED-RUN NO-OP (2026-07-29, sit_validated_tree_treadmill_blocks_breaking_promotes_2026_07_20.md
      # "Distinct sub-finding"): `job.status` is one of success/failure/cancelled. The original code
      # treated anything non-success as `sit-failed` — so a run cancelled mid-flight (e.g. an overlapping
      # dispatch superseded by a newer one) reported a FALSE failure, an uninformative verdict that can
      # still reach sit-unlock ahead of / after a genuinely green run. A cancelled run has no informative
      # verdict to report — no-op instead of dispatching either event.
      - name: Report SIT result to PM (drives sit-unlock)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "cancelled" ]; then
            echo "Job was cancelled — no informative verdict to report; skipping sit-passed/sit-failed dispatch."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then EVENT="sit-passed"; else EVENT="sit-failed"; fi
          gh api "repos/IggyIkenna/unified-trading-pm/dispatches" \
            -X POST -f event_type="$EVENT" \
            && echo "Dispatched $EVENT to unified-trading-pm" \
            || echo "::error::failed to dispatch $EVENT — staging lock will dangle"
