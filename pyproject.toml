[project]
name = "system-integration-tests"
version = "0.2.0"
description = "System integration tests — Layer 3a smoke + Layer 3b full e2e"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.0.1,<10.0.0",
    "unified-internal-contracts>=0.1.0",
    "unified-api-contracts>=0.1.0",
    "unified-events-interface>=0.1.0",
    "unified-trading-library>=0.1.0",
    "features-multi-timeframe-service",
    "features-calendar-service",
    "features-volatility-service",
    "features-commodity-service",
    "features-sports-service",
    "features-onchain-service",
    "features-cross-instrument-service",
    "pnl-attribution-service",
    "market-tick-data-service",
    "market-data-processing-service",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "boto3<2.0.0,>=1.40.70",  # optional, for AWS S3 integration tests
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
]

[tool.uv.sources.unified-internal-contracts]
path = "../unified-internal-contracts"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.uv.sources.unified-events-interface]
path = "../unified-events-interface"
editable = true

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.features-multi-timeframe-service]
path = "../features-multi-timeframe-service"
editable = true

[tool.uv.sources.features-calendar-service]
path = "../features-calendar-service"
editable = true

[tool.uv.sources.features-volatility-service]
path = "../features-volatility-service"
editable = true

[tool.uv.sources.features-commodity-service]
path = "../features-commodity-service"
editable = true

[tool.uv.sources.features-sports-service]
path = "../features-sports-service"
editable = true

[tool.uv.sources.features-onchain-service]
path = "../features-onchain-service"
editable = true

[tool.uv.sources.features-cross-instrument-service]
path = "../features-cross-instrument-service"
editable = true

[tool.uv.sources.pnl-attribution-service]
path = "../pnl-attribution-service"
editable = true

[tool.uv.sources.market-tick-data-service]
path = "../market-tick-data-service"
editable = true

[tool.uv.sources.market-data-processing-service]
path = "../market-data-processing-service"
editable = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G",
"C90",]


[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportMissingTypeStubs = false

[tool.coverage.report]
fail_under = 15  # Realistic for SIT: unit+integration ~18%; e2e/smoke require live services (CI only)

[tool.pytest.ini_options]
markers = [
    "smoke: Layer 3a — fast pipeline smoke tests (<5 min, run first)",
    "integration: Layer 3b — cross-library contract tests (no live services required)",
    "unit: Fast unit tests with no external dependencies",
    "aws_integration: Tests requiring real AWS credentials and S3 access",
    "e2e: Layer 3c — full end-to-end tests against live services",
    "version_cascade: Version cascade e2e tests using gh CLI (no push required)",
    "slow: Peak/sustained load performance tests — nightly or weekly CI only (excluded from PR CI)",
]
