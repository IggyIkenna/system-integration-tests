[project]
name = "system-integration-tests"
dynamic = ["version"]
description = "System integration tests — Layer 3a smoke + Layer 3b full e2e"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "pytest<10.0.0,>=9.0.3",
    "unified-trading-library>=0.72.0,<1.0.0",
    "market-data-processing-service>=0.25.0,<1.0.0",
    "features-service>=0.76.0,<1.0.0",
    "strategy-service>=0.52.0,<1.0.0",
    "unified-api-contracts>=0.97.0,<1.0.0",
    "alerting-service>=0.61.0,<1.0.0",
    "execution-service>=0.46.0,<1.0.0",
    "deployment-api>=0.68.0,<1.0.0",
    "instruments-service>=0.1.0,<1.0.0",
    "client-reporting-api>=0.1.0,<1.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "boto3<2.0.0,>=1.40.70",  # only for @pytest.mark.aws_integration tests (S3 cassette replay)
    "asyncpg>=0.31.0,<1.0.0",  # Cloud SQL / RDS smoke tests (test_database_smoke.py)
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "pip>=26.1.2",  # PYSEC-2026-196 (pip transitive via pip-audit/pip-api; fix=26.1.2)
    "bandit>=1.7.0,<2.0.0",
]
[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.market-data-processing-service]
path = "../market-data-processing-service"
editable = true

[tool.uv.sources.features-service]
path = "../features-service"
editable = true

[tool.uv.sources.strategy-service]
path = "../strategy-service"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.uv.sources.alerting-service]
path = "../alerting-service"
editable = true

[tool.uv.sources.execution-service]
path = "../execution-service"
editable = true

[tool.uv.sources.deployment-api]
path = "../deployment-api"
editable = true

[tool.uv.sources.instruments-service]
path = "../instruments-service"
editable = true

[tool.uv.sources.client-reporting-api]
path = "../client-reporting-api"
editable = true

# betfairlightweight (via execution-service) declares requests<2.33.0; workspace canonical is requests>=2.33.0
# (CVE-2026-25645). Override forces the resolved version upward. SSOT: .cursor/rules/dependencies/requests-betfairlightweight-workspace-resolution.mdc
#
# Transitive security pin (pip-audit) — keep at or above fix version. starlette is pulled in transitively via
# unified-trading-library's own starlette<1.3.0 pin (fastapi<0.137.0 only requires starlette>=1.1.0, so a plain
# re-lock stays on the vulnerable 1.1.0/1.2.1, PYSEC-2026-248/249, fix 1.3.0/1.3.1). Mirrors the already-verified fix
# in ml-service, unified-trading-api, and e2e-testing. SSOT: plans/active/issues/qg_red_blocking_workflow_template_and_pip_audit_2026_07_22.md.
[tool.uv]
override-dependencies = [
    "requests>=2.33.0,<3.0.0",
    "starlette>=1.3.1",
]

# ── ruff (lint + format) — canonical-tool-sections.toml 2026-05-26 ─────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# Rich union — E/F/W (pyflakes+pycodestyle), I (isort), N (pep8-naming),
# UP (pyupgrade), B (bugbear), C4 (comprehensions), SIM (simplify), RUF (ruff),
# G (logging-format), C90 (mccabe complexity).
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/**" = ["F401", "F841", "F811", "N806"]
"tests/conftest.py" = ["E402"]

# ── basedpyright (typecheck) — CONSOLIDATED from pyrightconfig.json 2026-05-26 ─
# DEVIATION (scripts-only repo): include covers all owned dirs — tests/ (was the
# sole include in pyrightconfig.json), scripts/, and system_integration_tests/
# (the thin package present at root). No importable library package; no single
# <PACKAGE_DIR> placeholder applies. extraPaths ported verbatim from
# pyrightconfig.json (6 paths); venvPath/venv removed (basedpyright resolves via
# pyproject.toml automatically).
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["tests", "scripts", "system_integration_tests"]
exclude = ["tests/e2e/test_aws_s3_smoke.py", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
# ── Type-correctness rules → "error" (strict). Full canonical set restored.
# ── Owned by ruff / pragmatic softenings.
# DEVIATION (scripts-only — from pyrightconfig.json): reportMissingImports set
# to "none" in old config; restored to "error" (canonical). reportImplicitRelativeImport
# was "none" in old config; omitted here (not in canonical set; default behaviour).

# Cross-repo import resolution — ported from pyrightconfig.json extraPaths (6 entries).
reportAny = "error"
reportMissingTypeStubs = false
reportImplicitRelativeImport = "none"
reportMissingImports = "none"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnusedFunction = "none"
[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    ".",
    "../deployment-api",
    "../unified-api-contracts",
    "../unified-trading-library",
    "../alerting-service",
    "../client-reporting-api",
    "../execution-service",
    "../features-service",
    "../instruments-service",
    "../market-data-processing-service",
    "../strategy-service",
]

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "smoke: Layer 3a — fast pipeline smoke tests (<5 min, run first)",
    "integration: Layer 3b — cross-library contract tests (no live services required)",
    "unit: Fast unit tests with no external dependencies",
    "aws_integration: Tests requiring real AWS credentials and S3 access",
    "e2e: Layer 3c — full end-to-end tests against live services",
    "version_cascade: Version cascade e2e tests using gh CLI (no push required)",
    "slow: Peak/sustained load performance tests — nightly or weekly CI only (excluded from PR CI)",
    "code_test: Static tests — no live services required; run in code-tests CI job (<10 min)",
    "deployment_test: Tests requiring docker-compose mock stack; run in deployment-tests CI job",
    "abbreviated_sit: Abbreviated SIT suite — fast contract and workflow sanity checks (<2 min, runs in hotfix path)",
    "real_flow: Real UI/API flow validation tests with triad assertions",
    "full_e2e: Full end-to-end deployment/pipeline tests requiring live services / docker stack",
    "critical: Critical journey — runs on every staging deploy",
    "high: High-priority journey — runs in nightly SIT",
    "medium: Medium-priority journey — runs in weekly SIT",
    "scorecard: Test contributes to flow-validation scorecard",
]

# ── coverage (run + report — BOTH required in every repo) ────────────────────────
# DEVIATION (scripts-only repo): source covers all owned dirs (tests/,
# system_integration_tests/, scripts/). fail_under = 0 because this is a
# tests-only repo with no packaged library; e2e/smoke tests require live
# services that are absent in CI unit runs. The existing value was 15 (comment
# said "Realistic for SIT: unit+integration ~18%"); reset to 0 per canonical
# scripts-only floor — no coverage gate applies here.
[tool.coverage.run]
source = ["tests", "system_integration_tests", "scripts"]
branch = true
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
fail_under = 2   # settled to the enforced stub floor (MIN_COVERAGE=2, Finding-#1 reconciliation); scripts/tests-only repo, e2e requires live services

# ── bandit (security SAST — every repo) ──────────────────────────────────────────
[tool.bandit]
skips = []

[tool.hatch.version]
source = "vcs"
